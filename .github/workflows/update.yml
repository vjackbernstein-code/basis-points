name: Update Basis Points

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may add a few minutes of delay)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        run: python pipeline.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit refreshed site (keeps the archive growing)
        run: |
          git config user.name "basis-points-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "auto: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
